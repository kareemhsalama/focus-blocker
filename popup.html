<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="popup.css" />
  <title>Focus Blocker</title>
</head>
<body>

  <div class="container">

    <!-- Header -->
    <div class="header">
      <h1>🎯 Focus Blocker</h1>
    </div>

    <!-- Session Timer -->
    <div class="section">
      <label class="label">Focus duration (minutes)</label>
      <div class="row">
        <input type="number" id="duration" value="25" min="1" max="120" />
        <button id="startBtn">Start</button>
      </div>
      <div id="timerDisplay" class="timer">No active session</div>
      <div id="progressTrack" class="progress-track" style="display:none;">
        <div id="progressBar" class="progress-bar"></div>
      </div>
      <div class="row" id="sessionControls" style="display:none; margin-top:4px;">
        <button id="breakBtn" class="secondary icon-btn" title="Take a break">
          <svg width="13" height="12" viewBox="0 0 13 12" fill="currentColor">
            <rect x="0" y="2" width="9" height="9" rx="1.5"/>
            <path d="M9 4h1a2 2 0 010 4H9" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/>
            <line x1="3" y1="1.5" x2="2.5" y2="0" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
            <line x1="6" y1="1.5" x2="5.5" y2="0" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
        </button>
        <button id="cancelBtn" class="danger icon-btn" title="Cancel session">
          <svg width="11" height="11" viewBox="0 0 11 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="1" y1="1" x2="10" y2="10"/><line x1="10" y1="1" x2="1" y2="10"/></svg>
        </button>
      </div>
    </div>

    <!-- Add Site -->
    <div class="section">
      <label class="label">Block a site</label>
      <div class="row">
        <input type="text" id="siteInput" placeholder="e.g. twitter.com" />
        <button id="addBtn">Add</button>
      </div>
      <p id="siteError" class="site-error"></p>
      <div id="bundleChips" class="bundle-chips"></div>
    </div>

    <!-- Block List -->
    <div class="section">
      <label class="label">Blocked sites</label>
      <ul id="blockList"></ul>
    </div>

  </div>

  <!-- Incognito warning -->
  <div id="incognitoWarning" class="incognito-warning" style="display:none;">
    ⚠️ Not blocking incognito — enable at chrome://extensions
  </div>

  <!-- Math challenge modal -->
  <div id="mathModal" class="math-modal" style="display:none;">
    <div class="math-inner">
      <p id="mathModalTitle" class="math-title">Prove you mean it</p>
      <p id="mathStep" class="math-meta"></p>
      <p id="mathQuestion" class="math-question"></p>
      <div class="row">
        <input type="number" id="mathInput" placeholder="Your answer" />
        <button id="mathCheck">✓</button>
      </div>
      <p id="mathFeedback" class="math-feedback"></p>
      <button id="mathAbort" class="math-abort">← Keep session going</button>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <script src="popup.js"></script>
</body>
</html>
